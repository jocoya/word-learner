<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>英文單字學習樂園</title>
  <link rel="stylesheet" href="style.css?v=30" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4A90D9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="單字樂園" />
</head>
<body>

  <!-- 首頁：選擇角色 -->
  <div id="page-home" class="page active">
    <div class="home-bg">
      <h1 class="home-title" onclick="if(typeof devTapVersion==='function')devTapVersion()">🌟 英文單字學習樂園 🌟</h1>
      <div class="child-switch" id="childSwitch">
        <span class="child-switch-label">現在是誰在玩？</span>
        <div class="child-switch-btns">
          <button class="child-btn" id="childBtnBoy" onclick="setChild('boy')">👦 小男生</button>
          <button class="child-btn" id="childBtnGirl" onclick="setChild('girl')">👧 小女生</button>
        </div>
      </div>
      <p class="home-sub">選擇你的模式</p>
      <div class="profile-cards">
        <button class="profile-card baby" onclick="enterMode('baby')">
          <div class="profile-icon"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26" fill="#FFF3E0"/><circle cx="20" cy="24" r="3" fill="#333"/><circle cx="36" cy="24" r="3" fill="#333"/><path d="M20 36c4 4 12 4 16 0" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round"/><circle cx="28" cy="12" r="4" fill="#FF9800"/></svg></div>
          <div class="profile-name">小寶貝模式</div>
          <div class="profile-desc">聽聽看、翻翻看</div>
        </button>
        <button class="profile-card kid" onclick="enterMode('kid')">
          <div class="profile-icon"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26" fill="#E8F5E9"/><circle cx="20" cy="24" r="3" fill="#333"/><circle cx="36" cy="24" r="3" fill="#333"/><path d="M20 36c4 4 12 4 16 0" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/><rect x="18" y="6" width="20" height="10" rx="5" fill="#4CAF50"/></svg></div>
          <div class="profile-name">挑戰模式</div>
          <div class="profile-desc">填空、拼字、說句子</div>
        </button>
      </div>
      <button class="btn-manage" onclick="goTo('page-manage')">⚙️ 管理單字</button>
      <button class="btn-manage" onclick="goTo('page-exams')">📝 考試複習包</button>
      <button class="btn-manage" onclick="startDailyChallenge()">🔥 每日挑戰</button>
      <button class="btn-manage" onclick="goTo('page-coins')">🪙 金幣庫</button>
      <button class="btn-manage" onclick="goTo('page-report')">📊 學習報告</button>
      <div class="home-tools">
        <button class="home-tool-btn" onclick="appUpdate()">🔄 更新</button>
        <button class="home-tool-btn" onclick="appClearCache()">🗑️ 清除快取</button>
      </div>
    </div>
    <div class="app-version" id="appVersion" onclick="if(typeof devTapVersion==='function')devTapVersion()">v30</div>
  </div>

  <!-- 遊戲選擇頁 -->
  <div id="page-games" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
      <h2 id="gamesTitle">選擇遊戲</h2>
    </div>
    <div class="game-source-select">
      <label>單字來源：</label>
      <select id="gameSource" onchange="updateGameSource()">
        <option value="permanent">全部單字</option>
        <option value="due">今日複習</option>
      </select>
      <select id="gameTagFilter" onchange="updateGameSource()">
        <option value="all">所有標籤</option>
      </select>
    </div>
    <div class="game-cards" id="gameCards"></div>
  </div>

  <!-- 單字管理頁 -->
  <div id="page-manage" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
      <h2>管理單字</h2>
      <div class="top-actions">
        <button class="btn-sm" onclick="showImportExport()">📤 匯出/匯入</button>
      </div>
    </div>
    <div class="manage-body">
      <div class="add-word-form">
        <div class="add-word-head">
          <h3>新增單字</h3>
          <button class="btn-sm" onclick="openAISettings()">⚙️ AI 設定</button>
        </div>
        <div class="form-row">
          <input id="newWord" type="text" placeholder="英文單字" />
          <input id="newMeaning" type="text" placeholder="中文意思" />
        </div>
        <div class="form-row">
          <button id="aiGenAllBtn_new" class="btn-genall" onclick="aiGenerateAll('new')">🤖 一鍵生成全部（意思+詞性+解釋+例句）</button>
        </div>
        <div class="form-row">
          <select id="newPos">
            <option value="">詞性（選填）</option>
            <option value="noun">名詞 noun</option>
            <option value="verb">動詞 verb</option>
            <option value="adj">形容詞 adj</option>
            <option value="adv">副詞 adv</option>
            <option value="prep">介系詞 prep</option>
            <option value="other">其他</option>
          </select>
          <input id="newAntonym" type="text" placeholder="反義詞（選填）" />
        </div>
        <div class="form-row">
          <input id="newDefinition" type="text" placeholder="英英解釋（選填）" />
          <button class="btn-upload" type="button" onclick="aiGenerateDefinition('newWord','newDefinition')">🤖 AI生成</button>
        </div>
        <div class="form-row" style="align-items:center;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input id="newAlreadyKnown" type="checkbox" />
            <span>✅ 我已經會這個字（直接進入大師期）</span>
          </label>
        </div>
        <div class="form-row">
          <select id="tagDropdown" onchange="addTagFromDropdown('tagDropdown','newTags','newTagChips')"><option value="">選擇標籤...</option></select>
          <input id="newTagManual" type="text" placeholder="或輸入新標籤" style="flex:1;" />
          <button class="btn-upload" type="button" onclick="addManualTag('newTagManual','newTags','newTagChips')">＋</button>
        </div>
        <input type="hidden" id="newTags" />
        <div class="tag-chips" id="newTagChips"></div>
        <div class="form-row">
          <input id="newSentence1" type="text" placeholder="例句 1" />
          <button class="btn-upload" type="button" onclick="aiGenerateSentence('newWord','newSentence1')">🤖 生成</button>
        </div>
        <div class="form-row">
          <input id="newSentence2" type="text" placeholder="例句 2（選填）" />
          <button class="btn-upload" type="button" onclick="aiGenerateSentence('newWord','newSentence2')">🤖 生成</button>
        </div>
        <div class="form-row">
          <input id="newSentence3" type="text" placeholder="例句 3（選填）" />
          <button class="btn-upload" type="button" onclick="aiGenerateSentence('newWord','newSentence3')">🤖 生成</button>
        </div>
        <div class="form-row">
          <input id="newImageUrl1" type="text" placeholder="圖片 1 URL（選填）" />
          <button class="btn-upload" type="button" onclick="searchImages('newWord', 'imageSearchResults', 'newImageUrl1')">🔍 搜圖</button>
        </div>
        <div class="form-row">
          <input id="newImageUrl2" type="text" placeholder="圖片 2 URL（選填）" />
          <button class="btn-upload" type="button" onclick="searchImages('newWord', 'imageSearchResults', 'newImageUrl2')">🔍 搜圖</button>
        </div>
        <div class="form-row">
          <input id="newImageUrl3" type="text" placeholder="圖片 3 URL（選填）" />
          <button class="btn-upload" type="button" onclick="searchImages('newWord', 'imageSearchResults', 'newImageUrl3')">🔍 搜圖</button>
          <label class="btn-upload">
            📷 相簿
            <input id="newImageFile" type="file" accept="image/*" onchange="handleImageUpload(event)" hidden />
          </label>
          <label class="btn-upload">
            📸 拍照
            <input type="file" accept="image/*" capture="environment" onchange="handleImageUpload(event)" hidden />
          </label>
        </div>
        <div id="imageSearchResults" class="image-search-results" hidden></div>
        <div id="imagePreview" class="image-preview" hidden></div>
        <button class="btn-primary" onclick="addWord()">新增</button>
      </div>

      <!-- AI 批次工具 -->
      <div class="batch-tools">
        <h3>🤖 AI 批次工具</h3>
        <div class="batch-btns">
          <button class="btn-sm" onclick="batchFillSentences()">📝 批次補例句（缺例句的字）</button>
          <button class="btn-sm" onclick="batchFillMeaning()">🀄 批次補中文意思</button>
          <button class="btn-sm" onclick="batchFillPos()">🔤 批次判斷詞性</button>
          <button class="btn-sm" onclick="openBulkImport()">📥 整批匯入單字</button>
        </div>
        <div class="batch-progress" id="batchProgress"></div>
      </div>

      <!-- 整批匯入對話框（內嵌） -->
      <div id="bulkImportBox" class="bulk-import-box" hidden>
        <h4>整批匯入（一行一個英文單字，AI 會自動補齊資料）</h4>
        <textarea id="bulkImportText" rows="8" placeholder="apple&#10;banana&#10;run&#10;happy&#10;..."></textarea>
        <div class="batch-btns">
          <button class="btn-primary" onclick="runBulkImport()">🚀 開始匯入</button>
          <button class="btn-ghost" onclick="document.getElementById('bulkImportBox').hidden=true">取消</button>
        </div>
        <div class="batch-progress" id="bulkProgress"></div>
      </div>
      <div class="word-list-header">
        <h3>單字列表 <span id="wordCount" style="color:#999;font-weight:400;font-size:.85em;"></span></h3>
        <input id="wordSearch" type="text" placeholder="搜尋..." oninput="renderWordList()" />
      </div>
      <div class="word-filter-row">
        <select id="wordFilter" onchange="renderWordList()">
          <option value="all">全部</option>
          <option value="no-image">缺圖片</option>
          <option value="no-sentence">缺例句</option>
        </select>
        <select id="posFilter" onchange="renderWordList()">
          <option value="all">所有詞性</option>
          <option value="noun">名詞</option>
          <option value="verb">動詞</option>
          <option value="adj">形容詞</option>
          <option value="adv">副詞</option>
          <option value="prep">介系詞</option>
          <option value="other">其他</option>
          <option value="none">未設定</option>
        </select>
        <select id="tagFilter" onchange="renderWordList()">
          <option value="all">所有標籤</option>
        </select>
      </div>
      <div id="wordList" class="word-list"></div>
    </div>
  </div>

  <!-- 考試複習包 -->
  <div id="page-exams" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
      <h2>考試複習包</h2>
    </div>
    <div class="manage-body">
      <div class="add-word-form">
        <h3>新增考試包</h3>
        <div class="form-row">
          <input id="examName" type="text" placeholder="主題名稱（如 Unit 3 - Animals）" />
          <input id="examDate" type="date" />
        </div>
        <button class="btn-primary" onclick="addExam()">建立</button>
      </div>
      <div id="examList" class="exam-list"></div>
    </div>
  </div>

  <!-- 考試包詳情 -->
  <div id="page-exam-detail" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-exams')">← 返回</button>
      <h2 id="examDetailTitle">考試包</h2>
      <div class="top-actions">
        <button class="btn-sm btn-green" onclick="startExamPractice()">▶ 開始練習</button>
        <button class="btn-sm btn-orange" onclick="graduateExam()">🎓 畢業到永久庫</button>
      </div>
    </div>
    <div class="manage-body">
      <div class="add-word-form">
        <h3>加入單字</h3>
        <div class="form-row">
          <input id="examNewWord" type="text" placeholder="英文單字" />
          <input id="examNewMeaning" type="text" placeholder="中文意思" />
        </div>
        <div class="form-row">
          <button id="aiGenAllBtn_exam" class="btn-genall" onclick="aiGenerateAll('exam')">🤖 一鍵生成全部（意思+詞性+解釋+例句）</button>
        </div>
        <div class="form-row">
          <select id="examNewPos">
            <option value="">詞性（選填）</option>
            <option value="noun">名詞 noun</option>
            <option value="verb">動詞 verb</option>
            <option value="adj">形容詞 adj</option>
            <option value="adv">副詞 adv</option>
            <option value="prep">介系詞 prep</option>
            <option value="other">其他</option>
          </select>
          <input id="examNewAntonym" type="text" placeholder="反義詞（選填）" />
        </div>
        <div class="form-row">
          <input id="examNewDefinition" type="text" placeholder="英英解釋（選填）" />
          <button class="btn-upload" type="button" onclick="aiGenerateDefinition('examNewWord','examNewDefinition')">🤖 AI生成</button>
        </div>
        <div class="form-row">
          <select id="examTagDropdown" onchange="addTagFromDropdown('examTagDropdown','examNewTags','examTagChips')"><option value="">選擇標籤...</option></select>
          <input id="examNewTagManual" type="text" placeholder="新標籤" style="flex:1;" />
          <button class="btn-upload" type="button" onclick="addManualTag('examNewTagManual','examNewTags','examTagChips')">＋</button>
        </div>
        <input type="hidden" id="examNewTags" />
        <div class="tag-chips" id="examTagChips"></div>
        <div class="form-row">
          <input id="examNewSentence1" type="text" placeholder="例句 1" />
          <button class="btn-upload" type="button" onclick="aiGenerateSentence('examNewWord','examNewSentence1')">🤖 生成</button>
        </div>
        <div class="form-row">
          <input id="examNewSentence2" type="text" placeholder="例句 2（選填）" />
          <button class="btn-upload" type="button" onclick="aiGenerateSentence('examNewWord','examNewSentence2')">🤖 生成</button>
        </div>
        <div class="form-row">
          <input id="examNewSentence3" type="text" placeholder="例句 3（選填）" />
          <button class="btn-upload" type="button" onclick="aiGenerateSentence('examNewWord','examNewSentence3')">🤖 生成</button>
        </div>
        <div class="form-row">
          <input id="examNewImageUrl1" type="text" placeholder="圖片 1 URL（選填）" />
          <button class="btn-upload" type="button" onclick="searchImages('examNewWord','examImageSearchResults','examNewImageUrl1')">🔍 搜圖</button>
        </div>
        <div class="form-row">
          <input id="examNewImageUrl2" type="text" placeholder="圖片 2 URL（選填）" />
          <button class="btn-upload" type="button" onclick="searchImages('examNewWord','examImageSearchResults','examNewImageUrl2')">🔍 搜圖</button>
        </div>
        <div class="form-row">
          <input id="examNewImageUrl3" type="text" placeholder="圖片 3 URL（選填）" />
          <button class="btn-upload" type="button" onclick="searchImages('examNewWord','examImageSearchResults','examNewImageUrl3')">🔍 搜圖</button>
          <label class="btn-upload">
            📷 相簿
            <input id="examNewImageFile" type="file" accept="image/*" onchange="handleExamImageUpload(event)" hidden />
          </label>
          <label class="btn-upload">
            📸 拍照
            <input type="file" accept="image/*" capture="environment" onchange="handleExamImageUpload(event)" hidden />
          </label>
        </div>
        <div id="examImageSearchResults" class="image-search-results" hidden></div>
        <div id="examImagePreview" class="image-preview" hidden></div>
        <button class="btn-primary" onclick="addExamWord()">新增</button>
      </div>
      <div id="examWordList" class="word-list"></div>
    </div>
  </div>

  <!-- 匯出匯入對話框 -->
  <div id="modal-import" class="modal" hidden>
    <div class="modal-content">
      <h3>匯出 / 匯入</h3>
      <button class="btn-primary" onclick="exportAllData()">📤 匯出全部資料 (JSON)</button>
      <div class="form-row" style="margin-top:12px">
        <label class="btn-upload" style="flex:1;text-align:center">
          📥 匯入 JSON 檔案
          <input type="file" accept=".json" onchange="importAllData(event)" hidden />
        </label>
      </div>
      <button class="btn-ghost" onclick="hideModal('modal-import')">關閉</button>
    </div>
  </div>

  <!-- 每日挑戰：選角色 -->
  <div id="page-daily-pick" class="page">
    <div class="home-bg">
      <h1 class="home-title" style="font-size:1.8em;">🔥 每日挑戰</h1>
      <p class="home-sub">誰要來挑戰？</p>
      <div class="profile-cards">
        <button class="profile-card baby" onclick="startDailyWithRole('boy')">
          <div class="profile-icon">👦</div>
          <div class="profile-name">小男生</div>
        </button>
        <button class="profile-card kid" onclick="startDailyWithRole('girl')">
          <div class="profile-icon">👧</div>
          <div class="profile-name">小女生</div>
        </button>
      </div>
      <div class="daily-level-row">
        <label class="daily-level-label">程度</label>
        <select id="dailyLevelBoy" onchange="saveDailyLevel('boy', this.value)">
          <option value="auto">👦 自動（依平均熟悉度）</option>
          <option value="beginner">👦 萌新（聽選圖+翻牌+泡泡）</option>
          <option value="intermediate">👦 中級（加句子排列）</option>
          <option value="advanced">👦 高級（加拼字）</option>
        </select>
        <select id="dailyLevelGirl" onchange="saveDailyLevel('girl', this.value)">
          <option value="auto">👧 自動（依平均熟悉度）</option>
          <option value="beginner">👧 萌新</option>
          <option value="intermediate">👧 中級</option>
          <option value="advanced">👧 高級</option>
        </select>
      </div>
      <button class="btn-manage" onclick="goTo('page-home')">← 返回</button>
    </div>
  </div>

  <!-- 每日挑戰頁 -->
  <div id="page-daily" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
      <h2>🔥 每日挑戰</h2>
      <div class="game-score" id="dailyScore"></div>
    </div>
    <div id="dailyArea" class="game-area"></div>
  </div>

  <!-- 金幣庫 -->
  <div id="page-coins" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
      <h2>🪙 金幣庫</h2>
    </div>
    <div class="manage-body">
      <div class="coin-summary" id="coinSummary"></div>
      <div class="reward-summary" id="rewardSummary"></div>
      <div class="calendar-section" id="calendarSection"></div>
      <div class="coin-log" id="coinLog"></div>
    </div>
  </div>

  <!-- 學習報告 -->
  <div id="page-report" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goTo('page-home')">← 返回</button>
      <h2>📊 學習報告</h2>
    </div>
    <div class="manage-body">
      <div class="report-tabs">
        <button class="report-tab active" id="reportTabBoy" onclick="renderReport('boy')">👦 小男生</button>
        <button class="report-tab" id="reportTabGirl" onclick="renderReport('girl')">👧 小女生</button>
      </div>
      <div id="reportBody"></div>
    </div>
  </div>

  <!-- 寶箱 modal -->
  <div id="modal-chest" class="modal" hidden>
    <div class="chest-modal">
      <div class="chest-stage" id="chestStage">
        <img class="chest-img chest-shake" id="chestImg" src="./images/BOX.png" alt="寶箱" onclick="openChest()">
        <div class="chest-hint">點擊寶箱打開！</div>
      </div>
      <div class="chest-reward" id="chestReward" hidden>
        <div class="chest-reward-img" id="chestRewardImg"></div>
        <div class="chest-reward-text" id="chestRewardText"></div>
        <button class="btn-primary" onclick="closeChestModal()">太棒了！</button>
      </div>
    </div>
  </div>

  <!-- 確認歸零 modal -->
  <div id="modal-redeem" class="modal" hidden>
    <div class="modal-content" style="text-align:center;">
      <h3 id="redeemTitle">確定要領取嗎？</h3>
      <p id="redeemDesc"></p>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px;">
        <button class="btn-primary" onclick="confirmRedeem()">✓ 確定</button>
        <button class="btn-ghost" onclick="hideModal('modal-redeem')">✕ 取消</button>
      </div>
    </div>
  </div>

  <!-- 編輯單字對話框 -->
  <div id="modal-edit" class="modal" hidden></div>

  <!-- 遊戲區域 -->
  <div id="page-game" class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="exitGame()">← 離開</button>
      <h2 id="gameTitle">遊戲</h2>
      <div class="game-score" id="gameScore"></div>
    </div>
    <div id="gameArea" class="game-area"></div>
  </div>

  <!-- 遊戲結算 -->
  <div id="page-result" class="page">
    <div class="result-screen">
      <div class="result-stars" id="resultStars"></div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="result-stats" id="resultStats"></div>
      <div id="resultCoinArea" style="margin:8px 0;font-size:1.5em;"></div>

  <script>
    var APP_VERSION = 'v30';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
      // 接收 service worker 回傳的版本號
      navigator.serviceWorker.addEventListener('message', function(e) {
        var d = e.data || {};
        if (d.type === 'VERSION' && d.version) {
          var v = d.version.replace('word-learner-', '');
          var el = document.getElementById('appVersion');
          // 顯示 HTML 版本 / SW 實際版本，不一致代表 SW 還是舊的（需按更新）
          if (el) {
            if (v === APP_VERSION) el.textContent = APP_VERSION;
            else el.textContent = APP_VERSION + ' (SW:' + v + ' 需更新)';
          }
        } else if (d.type === 'MEDIA_CACHE_CLEARED') {
          alert('已清除圖片/音檔快取！下次讀取會重新下載。');
        }
      });
      // 查詢目前版本
      navigator.serviceWorker.ready.then(function(reg) {
        if (reg.active) reg.active.postMessage({ type: 'GET_VERSION' });
      });
    }

    // 🔄 更新：強制清掉程式快取並重抓最新程式
    async function appUpdate() {
      try {
        // 1. 刪掉所有「程式快取」（保留 media 圖片/音檔快取）
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k) {
            // 只刪程式快取（word-learner-vXX），保留 word-learner-media
            if (k.indexOf('media') === -1) return caches.delete(k);
            return Promise.resolve();
          }));
        }
        // 2. 叫 service worker 更新 + 跳過等待
        if ('serviceWorker' in navigator) {
          var reg = await navigator.serviceWorker.getRegistration();
          if (reg) {
            await reg.update();
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        }
      } catch (e) { /* 忽略，照常重整 */ }
      // 3. 強制重整（加時間戳避免瀏覽器自身快取）
      location.reload(true);
    }

    // 🗑️ 清除圖片/音檔快取
    async function appClearCache() {
      if (!confirm('清除已下載的圖片和語音快取？\n（單字資料和學習進度不受影響，下次讀取會重新下載）')) return;
      try {
        // 顯示目前用量
        if (navigator.storage && navigator.storage.estimate) {
          var est = await navigator.storage.estimate();
          console.log('Storage used:', Math.round((est.usage||0)/1048576) + ' MB');
        }
        if ('serviceWorker' in navigator) {
          var reg = await navigator.serviceWorker.getRegistration();
          if (reg && reg.active) {
            reg.active.postMessage({ type: 'CLEAR_MEDIA_CACHE' });
            return; // 等 service worker 回 MEDIA_CACHE_CLEARED
          }
        }
        // 沒有 service worker 時直接清
        var keys = await caches.keys();
        await Promise.all(keys.filter(function(k){return k.indexOf('media')!==-1;}).map(function(k){return caches.delete(k);}));
        alert('已清除快取！');
      } catch (e) { alert('清除快取失敗：' + e.message); }
    }
  </script>
